QMainWindow, QDialog, QDockWidget {

QToolBar {
    background-color: palette(window);
    border: none;
}

QToolBar QToolButton {
    background: transparent;
}

QTreeView, QListView, QTableView {
    background-color: palette(alternate-base);
    color: palette(text);
    border: none;

QSplitter::handle {
    background-color: palette(dark);
}

QToolTip {
    color: palette(text);
    background-color: palette(base);

QStatusBar {
    background-color: palette(alternate-base);
    color: rgb(${c});
}

QMenuBar {
    background-color: palette(alternate-base);

}

QMenuBar::item {
    spacing: 2px;
    padding: 3px 4px;
    background: transparent;

QMenuBar::item:selected {
    background-color: palette(midlight);

    border-right: 1px solid palette(midlight);
}

QMenuBar::item:pressed {
    background-color: palette(highlight);
    border-left: 1px solid palette(dark);
    border-right: 1px solid palette(dark);
}

QMenu {
    background-color: palette(window);
    border: 1px solid palette(shadow);
}

QMenu::item {

    /*horrid workaround qt bug where shortcuts overlap menu text*/

QMenu::item:disabled {

}

QMenu::item:selected {

QMenu::icon:checked {
    background-color: palette(background);
    border: 1px solid rgb(${h});

}

QMenu::right-arrow {
    width: 10px;
    height: 10px;
    margin-right: 1px;
}

QMenu::separator {
    height: 1px;
    background: palette(alternate-base);
    margin-left: 10px;
    margin-right: 10px;
}

QMenu::indicator {
    position: absolute!important;
    top: 2px!important;
    left: 2px!important;

    height: 13px!important;
}

}

    width: 6px;

    background: palette(alternate-base);
}

QDockWidget::title {
    padding: 4px;
    background-color: palette(background);
    border: 1px solid palette(dark);
    border-bottom: 2px solid palette(dark);
}

QDockWidget::close-button,
QDockWidget::float-button {
    subcontrol-position: top right;

    position: absolute;
    top: 3px;
    bottom: 0px;

    height: 20px;

    right: 3px;
}

QDockWidget::float-button {

}

    subcontrol-origin: margin;
    subcontrol-position: left top;
    padding: 4px 6px;
    margin-left: 3px;
    background-color: palette(background);
    border: 1px solid palette(dark);
    border-bottom: 2px solid palette(midlight);
    border-top-left-radius: 4px;
    border-top-right-radius: 4px;
}

}

}

}

    border-bottom: 2px solid palette(midlight);
}

QTabBar::tab:!selected {

QTreeView,
QTableView {
    show-decoration-selected: 0;
    alternate-background-color: palette(window);
}

QTreeView QHeaderView::section,
QTableView QHeaderView::section {
    background-color: palette(background);
    border-style: none;
    border-bottom: 1px solid palette(dark);
    padding-left: 5px;
    padding-right: 5px;
}

/* 1. Forces the background behind the folder tree lines to stay completely
   transparent so the binder surface renders through seamlessly. */
QTreeView::branch {
    background: transparent;
}

QTreeView::branch {
    margin: 0;
    padding: 0;
}

/* 2. Disables the native system line assets from drawing default light
   graphics. The connector roles (adjoins-item, closed/open, active) are
   stubbed to a transparent border-image so Qt does not paint the default
   blocky system lines. */
QTreeView::branch:has-siblings:adjoins-item,
QTreeView::branch:!has-children:!has-siblings:adjoins-item,
QTreeView::branch:closed:has-children:has-siblings,
QTreeView::branch:has-children:!has-siblings:closed,
QTreeView::branch:open:has-children:has-siblings,
QTreeView::branch:open:has-children:!has-siblings,
QTreeView::branch:has-siblings:!adjoins-item,
QTreeView::branch:active:has-siblings:!adjoins-item,
QTreeView::branch:!active:has-siblings:!adjoins-item {
    border-image: none !important;
    background-color: transparent !important;
}

/* 2b. Keep expand/collapse carets functional with the built-in dark
   connector glyphs, instead of leaving blank space (as an empty
   border-image:none alone would). */
QTreeView::branch:has-children:!has-siblings:closed,
QTreeView::branch:closed:has-children:has-siblings {
    image: url(:/Resources/${o}/icon_branch_closed.svg);
}

QTreeView::branch:open:has-children:!has-siblings,
QTreeView::branch:open:has-children:has-siblings {
    image: url(:/Resources/${o}/icon_branch_open.svg);
}

/* 3. Ensures the tree hierarchy indentation levels blend seamlessly with
   the main sidebar background while keeping row highlights working. */
QTreeView::item {
    background: transparent;
    border: none;
}

QTreeView::item:selected:active,
QTreeView::item:selected:!active {
    background: palette(highlight);
    color: palette(highlighted-text);
}


/* --- Advanced menu overrides (the app's four accent controls, last wins) --- */

QTextEdit {
    background-color: palette(base);
    color: palette(text);
}

QMenuBar::item {
    color: ${w.advanced.menuFont};
}

QMenuBar::item:pressed {
    background-color: ${w.advanced.activeMenuAccent};
    color: ${w.advanced.menuFont};
}

QMenu {
    background-color: ${w.advanced.dropdownBackground};
}

QMenu::item {
    color: ${w.advanced.dropdownText};
}

QMenu::item:selected {
    background-color: ${w.advanced.activeMenuAccent};
    color: ${w.advanced.menuFont};
}
