<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-label="Front cover of Flutter by Adrian Kestrel, showing a steampunk sky-ship at sunset">
  <defs>
    <linearGradient id="flutterSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b160f"/>
      <stop offset="28%" stop-color="#7a3b1e"/>
      <stop offset="48%" stop-color="#d98a3d"/>
      <stop offset="72%" stop-color="#5d275f"/>
      <stop offset="100%" stop-color="#1d1030"/>
    </linearGradient>
    <linearGradient id="flutterShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.08"/>
      <stop offset="55%" stop-color="#2a0f2e" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#12061f" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="flutterGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffcf7a" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#ff9d4d" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff9d4d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="900" fill="url(#flutterSky)"/>
  <rect width="600" height="900" fill="url(#flutterGlow)"/>

  <g opacity="0.28" fill="#2a1130">
    <ellipse cx="115" cy="405" rx="135" ry="34"/>
    <ellipse cx="490" cy="455" rx="150" ry="40"/>
    <ellipse cx="300" cy="805" rx="330" ry="90"/>
  </g>

  <g stroke="#150817" stroke-width="3" opacity="0.72">
    <line x1="300" y1="245" x2="130" y2="625"/>
    <line x1="300" y1="245" x2="475" y2="625"/>
    <line x1="205" y1="315" x2="155" y2="625"/>
    <line x1="395" y1="315" x2="450" y2="625"/>
    <line x1="300" y1="360" x2="105" y2="560"/>
    <line x1="300" y1="360" x2="500" y2="560"/>
  </g>

  <g fill="rgba(255,190,100,0.16)" stroke="rgba(18,7,22,0.45)" stroke-width="3">
    <path d="M188 322 C245 395 245 505 188 592 C150 500 150 405 188 322 Z"/>
    <path d="M412 322 C455 405 455 500 412 592 C355 505 355 395 412 322 Z"/>
  </g>

  <g fill="#140817">
    <rect x="282" y="238" width="36" height="118" rx="5"/>
    <rect x="258" y="330" width="84" height="18" rx="4"/>
    <rect x="246" y="382" width="108" height="16" rx="4"/>
    <path d="M145 610 C215 558 385 558 455 610 L428 702 C355 738 245 738 172 702 Z"/>
    <path d="M300 700 L268 795 L332 795 Z"/>
