    <circle cx="378" cy="522" r="36"/>
    <circle cx="300" cy="578" r="23"/>
  </g>
  <g stroke="#21102a" stroke-width="4" opacity="0.8">
    <line x1="224" y1="492" x2="224" y2="552"/>
    <line x1="194" y1="522" x2="254" y2="522"/>
    <line x1="378" y1="486" x2="378" y2="558"/>
    <line x1="342" y1="522" x2="414" y2="522"/>
    <line x1="300" y1="555" x2="300" y2="601"/>
    <line x1="277" y1="578" x2="323" y2="578"/>
  </g>

  <rect width="600" height="900" fill="url(#flutterShade)"/>

  <text x="300" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" letter-spacing="2" fill="#f3c37b">“NOW THIS IS STEAMPUNK” JEFF PORTNOY</text>
  <text x="300" y="158" text-anchor="middle" font-family="Georgia, serif" font-size="68" font-weight="700" letter-spacing="1" fill="#18a9d8">ADRIAN</text>
  <text x="300" y="226" text-anchor="middle" font-family="Georgia, serif" font-size="68" font-weight="700" letter-spacing="1" fill="#18a9d8">KESTREL</text>

  <g fill="none" stroke="#e93aa2" stroke-width="3">
