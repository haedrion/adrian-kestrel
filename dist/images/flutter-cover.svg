  <circle cx="300" cy="642" r="8" fill="#3b0f35"/>

  <text x="300" y="728" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="94" font-weight="900" letter-spacing="1" fill="#fff">FLUTTER</text>
  <text x="300" y="838" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" letter-spacing="3" fill="#18a9d8">INTERNATIONAL BEST SELLER</text>
